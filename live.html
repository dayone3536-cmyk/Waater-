<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Debate Arena</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Inter,system-ui,sans-serif;
    }

    body{
        background:#0f1117;
        color:white;
        height:100vh;
        display:flex;
        flex-direction:column;
    }

    /* TOP BAR */

    .top-bar{
        height:75px;
        background:#151924;
        border-bottom:1px solid rgba(255,255,255,0.08);

        display:flex;
        justify-content:space-between;
        align-items:center;

        padding:0 30px;
    }

    .topic{
        font-size:1.2rem;
        font-weight:700;
        color:#46c2ff;
        flex: 1 ;


    }

    .timer{
        background:#22283a;
        padding:10px 18px;
        border-radius:999px;
        font-weight:700;
    }

    .watchers{
        color:#9ca3af;
    }

    /* DEBATERS */

    .debaters{
        display:flex;
        justify-content:space-between;
        align-items:center;

        padding:20px 40px;
    }

    .user-card{
        display:flex;
        align-items:center;
        gap:15px;
    }

    .avatar{

        width:55px;
        height:55px;
        border-radius:50%;
        background:linear-gradient(
            135deg,
            #6d5dfc,
            #46c2ff
        );

        object-fit:cover;
        display:block;

    }

    .name{
        font-weight:700;
    }

    .role{
        color:#9ca3af;
        font-size:.9rem;
    }

    /* CHAT AREA */

    .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 30px;

        display: flex;
        flex-direction: column;
        gap: 20px;

        background: #101521;
    }


    .argument {
        max-width: 65%;
        padding: 16px 20px;
        border-radius: 18px;
        line-height: 1.6;
        font-size: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,.25);
    }

    .argument{

        position:relative;
        touch-action:pan-y;
        cursor:grab;
        transition:transform .2s ease;
    }

    .argument.dragging{ transition:none; }


    .argument.left .reply-icon{ right:-38px; }

    .argument.right .reply-icon{ left:-38px; }

    


    .left{
        align-self:flex-start;
        background:#1b2333;
    }

    .right{
        align-self:flex-end;
        background:linear-gradient(
            135deg,
            #6d5dfc,
            #4f7cff
        );
        
      }

    /* INPUT */

    .bottom-bar{

        padding:12px 16px;
        background:#151924;
        border-top:1px solid rgba(255,255,255,0.08);
        display:flex;
        align-items:flex-end;

    }

    .input-pill{
        flex:1;
        display:flex;
        align-items:flex-end;
        gap:4px;
        background:#1f2635;
        border-radius:28px;
        padding:6px 6px 6px 18px;
    }

    .input-pill textarea{
        flex:1;
        resize:none;
        border:none;
        outline:none;
        background:transparent;
        color:white;
        font-family:Inter,system-ui,sans-serif;
        font-size:15px;
        line-height:1.4;
        padding:11px 4px;
        max-height:120px;
        min-height:22px;
    }

    .pill-icon-btn{

        border:none;
        cursor:pointer;

        border-radius:50%;
        width:42px;
        height:48px;

        flex-shrink:0;
        display:flex;
        align-items:center;

        justify-content:center;
        color:white;
        transition:transform .15s ease, filter .15s ease, background .15s ease;
    }

    .pill-icon-btn svg{
        width:22px;
        height:22px;
    }

    .mic-btn{
        background:#2a3142;
    }

    .mic-btn.recording{
        background:#ff4d4d;
        animation: pulse 1.2s infinite;
    }

    .send-btn2{
        background:linear-gradient(135deg,#6d5dfc,#4f7cff);
    }

    .send-btn2:hover{
        transform:translateY(-2px);
    }

    .send-btn2:active{
        transform:scale(.92);
    }




    @keyframes pulse{

        0%   { box-shadow: 0 0 0 0 rgba(255,77,77,.6); }
        70%  { box-shadow: 0 0 0 14px rgba(255,77,77,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); }

    } 

    /* momentum bar */

    .typing-indicator {

    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 18px;
    background: #1b2333;
    border-radius: 18px;
    width: fit-content;

    }

    .typing-indicator.left {

    align-self: flex-start;

    }

    .typing-indicator.right {

        align-self: flex-end;
        background: linear-gradient(135deg, #6d5dfc, #4f7cff);

    }

    .typing-indicator span {

        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
        animation: typingBounce 1.2s infinite ease-in-out;

    }

    .typing-indicator span:nth-child(1){ animation-delay: 0s; }
    .typing-indicator span:nth-child(2){ animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3){ animation-delay: 0.4s; }

    @keyframes typingBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: .5; }
        30% { transform: translateY(-6px); opacity: 1; }
    }
     /* .float-vote */
    .share-btn{
        display:flex;
        align-items:center;
        gap:8px;

        border:none;
        cursor:pointer;

        border-radius:999px;
        padding:10px 20px;

        color:white;
        font-weight:700;
        font-size:.9rem;

        background:linear-gradient(135deg,#6d5dfc,#4f7cff);
        box-shadow:0 4px 14px rgba(79,124,255,.35);

        transition:transform .2s, box-shadow .2s;
    }

    .share-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 6px 18px rgba(79,124,255,.5);
    }

    .share-btn:active{
        transform:translateY(0);
    }

    .share-btn svg{
        width:16px;
        height:16px;
    }

    .share-toast{
        position:fixed;
        bottom:90px;
        left:50%;
        transform:translateX(-50%) translateY(20px);
        background:#1f2635;
        color:white;
        padding:10px 20px;
        border-radius:999px;
        font-size:.85rem;
        font-weight:600;
        box-shadow:0 4px 20px rgba(0,0,0,.4);
        opacity:0;
        pointer-events:none;
        transition:opacity .25s, transform .25s;
        z-index:2500 ;
    }

    .share-toast.show{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }

    .milestone-toast{

        position:fixed;
        bottom:90px;
        left:50%;
        transform:translateX(-50%) translateY(20px);
        display:flex;
        align-items:center;
        gap:12px;
        background:#1f2635;
        color:white;
        padding:12px 16px 12px 20px;
        border-radius:999px;
        font-size:.85rem;
        font-weight:600;
        box-shadow:0 4px 20px rgba(0,0,0,.4);
        opacity:0;
        pointer-events:none;
        transition:opacity .25s, transform .25s;
        z-index:2500;
        max-width:90vw;

    }

    .milestone-toast.show{

        opacity:1;
        transform:translateX(-50%) translateY(0);
        pointer-events:auto;

    }


    .milestone-share-btn{

        border:none;
        cursor:pointer;
        padding:8px 16px;

        border-radius:999px;
        font-weight:700;

        font-size:.8rem;
        color:white;
        background:linear-gradient(135deg,#6d5dfc,#4f7cff);
        flex-shrink:0;

    }

    .vote-bar{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:40px;
        width:100%;
        padding:8px 0;
    }


    .vote-avatar-btn{
        background:none;
        border:none;
        outline:none;
        -webkit-tap-highlight-color: transparent;
        cursor:pointer;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:4px;
        flex-shrink:0;
        transition:transform .15s ease;
    }

    .vote-avatar-btn:hover{ transform:translateY(-2px); }
    .vote-avatar-btn:active{ transform:scale(.9); }



    .vote-avatar-btn .ring{
        width:44px;
        height:44px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:1.2rem;
        box-shadow:0 0 0 0 rgba(70,194,255,.5);
        z-index:1;
        

    }

    .ring-avatar{
        width:100%;
        height:100%;
        border-radius:50%;
        object-fit:cover;
    }



    .vote-avatar-btn.left-side .ring{
        background:#000000;   /* matches your .left bubble */
    }

    .vote-avatar-btn.right-side .ring{
        background:#2563eb; /* matches your .right bubble */
    }

    .vote-avatar-btn.voted .ring{

        box-shadow: 0 0 0 4px rgba(255,255,255,.25), 0 0 16px currentColor;
    }

    .vote-avatar-btn.left-side.voted .ring{

        box-shadow: 0 0 0 4px rgba(255,255,255,.25), 0 0 16px #000000;
        outline: 2px solid #555;

    }

    .vote-avatar-btn.right-side.voted .ring{

        box-shadow: 0 0 0 4px rgba(255,255,255,.25), 0 0 16px #2563eb;
    }



    .momentum-bar{

        position:relative;
        height:6px;
        border-radius:999px;
        background:#1f2635;

        overflow:visible;
        margin:0 -8px;


        flex:1;

    }

    .momentum-marker{

        position:absolute;
        top:50%;
        left:50%;
        width:5px;

        height:64px;   /* was 44px — increase this to make it taller */
        border-radius:50%;
        background:#fff;

        box-shadow:0 0 8px rgba(255,255,255,.8);
        transform:translate(-50%,-50%);
        transition:left .6s cubic-bezier(.4,0,.2,1);
        z-index:2;

}




    .momentum-fill{

        position:absolute;
        top:0; left:0;
        height:100%;
        width:50%;
        border-radius:999px;
        background:linear-gradient(90deg,#6d5dfc,#46c2ff);
        transition:width .6s cubic-bezier(.4,0,.2,1);
    }

    .momentum-row{
        display:flex;
        align-items:center;
        gap:0;
        padding:4px 0 2px;
    }


    @keyframes votePulse{
        0%{ box-shadow:0 0 0 0 rgba(70,194,255,.6); }
        100%{ box-shadow:0 0 0 16px rgba(70,194,255,0); }
    }

    .vote-pct{
        font-size:.7rem;
        font-weight:700;
        color:#9ca3af;
        min-width:30px;
        text-align:center;
    }

    .crowd-lean{
        text-align:center;
        font-size:.72rem;
        color:#9ca3af;
        padding-bottom:4px;
        min-height:14px;
        transition:opacity .3s;
    }

    .crowd-lean.shift{
        color:#46c2ff;
    }

    .float-vote{
        position:fixed;
        pointer-events:none;
        font-size:1.1rem;
        font-weight:700;
        color:#46c2ff;
        animation:floatUp 1s ease-out forwards;
        z-index:1000;
    }

    @keyframes floatUp{
        0%{ opacity:1; transform:translateY(0); }
        100%{ opacity:0; transform:translateY(-50px); }
    }

    .voting-bar{
        padding:10px 20px 16px;
        background:#151924;
        border-top:1px solid rgba(255,255,255,0.08);
        display:none; /* shown via JS once we know the role */
    }

    .voting-bar.view-only .vote-avatar-btn{
        cursor:default;
        pointer-events:none;
    }


    .forfeit-overlay{
    position:fixed; inset:0;
    background:rgba(10,12,20,0.7);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:2000;
    animation:forfeitFadeIn .2s ease-out;
}

    @keyframes forfeitFadeIn{
        from{ opacity:0; }
        to{ opacity:1; }
    }

    .forfeit-box{
        background:#151924;
        border:1px solid rgba(255,255,255,0.08);
        border-radius:20px;
        padding:40px 36px 32px;
        max-width:420px;
        width:90%;
        text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,0.02);
        animation:forfeitPop .25s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes forfeitPop{
        from{ opacity:0; transform:scale(.9) translateY(10px); }
        to{ opacity:1; transform:scale(1) translateY(0); }
    }

    .forfeit-icon{
        width:60px;
        height:60px;
        margin:0 auto 18px;
        border-radius:50%;
        background:linear-gradient(135deg, rgba(239,68,68,.18), rgba(239,68,68,.05));
        border:1px solid rgba(239,68,68,.3);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:1.6rem;
    }

    .forfeit-box p{
        margin-bottom:8px;
        font-weight:700;
        font-size:1.25rem;
    }

    .forfeit-sub{
        color:#9ca3af;
        font-size:.92rem;
        margin-bottom:28px;
        line-height:1.5;
    }

    .forfeit-actions{
        display:flex;
        gap:12px;
        justify-content:center;
    }

    .forfeit-btn{
        border:none;
        cursor:pointer;
        padding:14px 0;
        flex:1;
        border-radius:12px;
        font-weight:700;
        font-size:1rem;
        transition:transform .15s ease, filter .15s ease;
    }

    .forfeit-btn:hover{
        transform:translateY(-1px);
        filter:brightness(1.1);
    }

    .forfeit-btn:active{
        transform:translateY(0);
        filter:brightness(.95);
    }

    .forfeit-btn.no{
        background:linear-gradient(135deg, #ef4444, #dc2626);
        color:white;
        box-shadow:0 4px 14px rgba(239,68,68,.35);
    }

    .forfeit-btn.yes{
        background:#242b3d;
        color:white;
        border:1px solid rgba(255,255,255,0.06);
    }

    .forfeit-actions.stacked{

        flex-direction:column;

    }

    .forfeit-actions.stacked .forfeit-btn{

        width:100%;

    }


    .icon-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:44px;
      height:44px;
      border:none;
      cursor:pointer;
      border-radius:50%;
      color:white;
      background:linear-gradient(135deg,#6d5dfc,#4f7cff);
      box-shadow:0 4px 14px rgba(79,124,255,.35);
      transition:transform .2s, box-shadow .2s;
      flex-shrink:0;
      margin-left:8px;
  }
  
  .icon-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 18px rgba(79,124,255,.5);
  }
  .icon-btn svg{ width:18px; height:18px; }
  
  .clip-overlay{
      position:fixed; inset:0;
      background:rgba(10,12,20,.75);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      z-index:2000;
  }
  .clip-box{
      background:#151924;
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:28px 24px;
      max-width:420px;
      width:90%;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  .clip-box img{ width:100%; border-radius:12px; margin-bottom:16px; display:block; }
  .clip-box p{ font-weight:700; margin-bottom:16px; }
    .clip-share-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }


    .results-banner{
        text-align:center;
        margin-bottom:18px;
    }

    .results-emoji{
        font-size:2.2rem;
        display:block;
        margin-bottom:6px;
    }

    .results-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:0;
    }

    .results-action-row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-bottom:18px;
    }

    .results-votes-card{
        background:linear-gradient(135deg, rgba(109,93,252,.18), rgba(70,194,255,.1));
        border:1px solid rgba(70,194,255,.25);
        border-radius:16px;
        padding:18px;
        text-align:center;
        margin-bottom:14px;
    }
    .results-votes-number{
        font-size:2rem;
        font-weight:800;
        color:#46c2ff;
        line-height:1;
    }
    .results-votes-label{
        font-size:.8rem;
        color:#9ca3af;
        margin-top:4px;
    }
    .results-invite-card{
        display:flex;
        align-items:center;
        gap:14px;
        background:#1b2333;
        border:1px solid rgba(255,255,255,.06);
        border-radius:16px;
        padding:16px;
        margin-bottom:16px;
        text-align:left;
    }
    .results-invite-icon{
        font-size:1.6rem;
        flex-shrink:0;
    }
    .results-invite-text{
        flex:1;
        display:flex;
        flex-direction:column;
        gap:2px;
    }
    .results-invite-text strong{
        font-size:.92rem;
    }
    .results-invite-text span{
        font-size:.78rem;
        color:#9ca3af;
    }
    .results-invite-cta{
        border:none;
        cursor:pointer;
        padding:10px 18px;
        border-radius:999px;
        font-weight:700;
        font-size:.85rem;
        color:white;
        background:linear-gradient(135deg,#6d5dfc,#4f7cff);
        flex-shrink:0;
        transition:transform .15s ease, filter .15s ease;
    }
    .results-invite-cta:hover{
        transform:translateY(-1px);
        filter:brightness(1.1);
    }




    
    .clip-share-btn{        
      border:none; cursor:pointer;
      padding:14px 0;
      border-radius:12px;
      font-weight:700;
      color:white;
      background:#242b3d;
      border:1px solid rgba(255,255,255,.06);
      transition:transform .15s ease, filter .15s ease;
    }

  .clip-share-btn:hover{ transform:translateY(-1px); filter:brightness(1.1); }

  .clip-close{
    
    margin-top:16px;
    background:none;
    border:none;
    color:#9ca3af;
    cursor:pointer;
    font-size:.85rem;
  }


  .clip-download-row{

        display:flex;
        justify-content:center;
        margin-bottom:16px;

    }

    .clip-download-icon-btn{

        display:flex;
        align-items:center;
        justify-content:center;
        width:38px;
        height:38px;
        border:none;
        cursor:pointer;
        border-radius:50%;
        color:white;
        background:#242b3d;
        border:1px solid rgba(255,255,255,.08);
        transition:transform .15s ease, background .15s ease;
    }

    .clip-download-icon-btn:hover{
        transform:translateY(-2px);
        background:#2d3548;
    }

    .clip-download-icon-btn svg{
        width:18px;
        height:18px;
    }


/* ---------------- ENGAGEMENT BAR (Like / Dislike / Comment) ---------------- */

.engage-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:12px 20px;
    background:#151924;
    border-top:1px solid rgba(255,255,255,0.08);
}

.engage-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:#1b2333;
    border:1px solid rgba(255,255,255,0.08);
    color:#9ca3af;
    border-radius:999px;
    padding:9px 18px;
    font-family:Inter,system-ui,sans-serif;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
}

.engage-btn:hover{
    border-color:rgba(255,255,255,0.2);
    color:#e5e7eb;
    transform:translateY(-1px);
}

.engage-btn:active{
    transform:translateY(0) scale(.96);
}

.engage-btn svg{
    width:19px;
    height:19px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
}

.engage-btn.liked{
    color:#22c55e;
    border-color:rgba(34,197,94,.4);
    background:rgba(34,197,94,.1);
}
.engage-btn.liked svg{ fill:#22c55e; }

.engage-btn.disliked{
    color:#ef4444;
    border-color:rgba(239,68,68,.4);
    background:rgba(239,68,68,.1);
}
.engage-btn.disliked svg{ fill:#ef4444; }

/* ---------------- COMMENT DRAWER ---------------- */

.comment-backdrop{
    position:fixed; inset:0;
    background:rgba(10,12,20,.6);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:2400;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
}
.comment-backdrop.open{
    opacity:1;
    pointer-events:auto;
}

.comment-drawer{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:2500;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.comment-drawer.open{
    transform:translateY(0);
}

.comment-drawer-inner{
    max-width:640px;
    margin:0 auto;
    background:#151924;

    border:1px solid rgba(255,255,255,0.08);
    border-bottom:none;

    border-radius:20px 20px 0 0;
    max-height:72vh;
    display:flex;
    
    flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
}

    .comment-drawer-header{
        display:flex;
        align-items:center;
        justify-content:space-between;

        padding:18px 20px 12px;
        font-family:Inter,system-ui,sans-serif;

        font-weight:700;
        font-size:1rem;

        border-bottom:1px solid rgba(255,255,255,0.06);

    }

    .comment-drawer-close{
        background:none;
        border:none;
        color:#9ca3af;
        font-size:1.1rem;
        cursor:pointer;
        line-height:1;
        padding:4px;

    }

    .comment-drawer-close:hover{ color:white; }

    function updateVoteDisplay(proVotes, againstVotes) {

        document.getElementById('momentumFill').style.width = rightPct + '%';

    async function castReplayVote(roomId, side, evt) {

        float.textContent = '+1';

        float.style.top = rect.top + 'px';
        document.body.appendChild(float);

            const res = await fetch(`/past-matches/${roomId}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

            });
            const tally = await res.json();
            updateVoteDisplay(tally.pro, tally.against);
        } catch (err) {
            console.error('Vote failed:', err);
        }
    }

        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>

    micBtn.innerHTML = micIconMic; // set initial icon on load



    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        micBtn.style.display = 'none';
    } else {

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // or 'ml-IN', or wire up your language selector
        recognition.continuous = true;       // keep listening
        recognition.interimResults = false;

        let isRecording = false;
        let userStoppedManually = false;

        micBtn.addEventListener('click', async () => {
            if (isRecording) {
                userStoppedManually = true;
                recognition.stop();
                return;
            }
            userStoppedManually = false;

                await navigator.mediaDevices.getUserMedia({ audio: true });
                recognition.start();

function pickRandomMessages(args, count) {

    const pool = [...args];
    const picked = [];
    while (pool.length && picked.length < count) {
        const i = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(i, 1)[0]);

    }

    // keep chat order rather than random shuffle order

    return picked.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

}

    const SWIPE_REPLY_THRESHOLD = 60;

    const SWIPE_REPLY_MAX = 90;

    function attachSwipeToReply(el, text, senderRole){

        let startX = 0, currentX = 0, dragging = false, pointerId = null;

        el.addEventListener('pointerdown', (e) => {

            if (e.pointerType === 'mouse' && e.button !== 0) return;

            dragging = true;
            pointerId = e.pointerId;

            startX = e.clientX;
            el.classList.add('dragging');
            el.setPointerCapture(pointerId);

        });

        el.addEventListener('pointermove', (e) => {

            if (!dragging || e.pointerId !== pointerId) return;
            currentX = e.clientX - startX;

            const isLeft = el.classList.contains('left');
            if (isLeft && currentX < 0) currentX = 0;
            if (!isLeft && currentX > 0) currentX = 0;


            const clamped = Math.max(-SWIPE_REPLY_MAX, Math.min(SWIPE_REPLY_MAX, currentX));
            el.style.transform = `translateX(${clamped}px)`;

            const icon = el.querySelector('.reply-icon');
            const progress = Math.min(1, Math.abs(clamped) / SWIPE_REPLY_THRESHOLD);

            icon.style.opacity = progress;
            icon.style.transform = `translateY(-50%) scale(${0.5 + 0.5 * progress})`;
            icon.classList.toggle('ready', progress >= 1);

        });

        function endDrag(e){

            if (!dragging || e.pointerId !== pointerId) return;
            dragging = false;
            el.classList.remove('dragging');

            el.style.transform = '';
            const icon = el.querySelector('.reply-icon');

            icon.style.opacity = 0;
            icon.classList.remove('ready');

            if (Math.abs(currentX) >= SWIPE_REPLY_THRESHOLD){

                if (navigator.vibrate) navigator.vibrate(15);
                setReplyTarget(text, senderRole);

            }

            currentX = 0;
        }

        el.addEventListener('pointerup', endDrag);

        el.addEventListener('pointercancel', endDrag);
    }

        const myVotes = mySide === 'pro' ? proVotes : againstVotes;
        const oppVotes = mySide === 'pro' ? againstVotes : proVotes;

        if (myVotes >= oppVotes) {
            // back in front or tied — reset so a future dip shows the nudge again
            losingModalShown = false;
            lastDismissedMargin = 0;
            return;
        }

        const margin = oppVotes - myVotes;

        // First time losing, or fallen further behind since they last dismissed it
        if (losingModalShown && margin < lastDismissedMargin + 3) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let gestureDirection = null; // 'horizontal' | 'vertical' | null

    document.addEventListener('touchstart', (e) => {
        if (!canSwipe) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        gestureDirection = null;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        if (!canSwipe || gestureDirection) return;

        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;

        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

        gestureDirection = Math.abs(dx) > Math.abs(dy) * 1.5 ? 'horizontal' : 'vertical';
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        if (!canSwipe) return;
        const wasHorizontal = gestureDirection === 'horizontal';
        gestureDirection = null;
        if (!wasHorizontal) return;

        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) < 50) return;

        if (diff > 0) {
            goToNextDebate();
        } else {
            goToPrevDebate();
        }
    }, { passive: true });

        if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        if (Math.abs(e.deltaX) < 30) return;

        wheelLock = true;
        if (e.deltaX > 0) goToNextDebate();
        else goToPrevDebate();

        setTimeout(() => { wheelLock = false; }, 500);
    }, { passive: true });

    async function postComment(){

        const message = commentInput.value.trim();
        if (!message) return;

        if (!(await window.requireLogin())) return;

        const idToken = await window.getIdToken();

        if (!idToken) {
            alert('Please sign in to comment.');
            return;
        }

        commentSendBtn.disabled = true;

        try {
            const res = await fetch(`/match/${currentRoomId}/comments`, {

                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Authorization': `Bearer ${idToken}`

                },

                body: JSON.stringify({ message })

            });

            if (!res.ok){

                const err = await res.json().catch(()=>({}));

                alert(err.error || 'Could not send comment.');
                return;

            }

            const newComment = await res.json(); // <-- server must return the created comment

            commentInput.value = '';

            // render instantly, don't wait for the socket broadcast

            addCommentToList(newComment);
            updateCommentCount(commentList.querySelectorAll('.comment-item').length);

            commentList.scrollTop = commentList.scrollHeight;

        } catch(e){

            alert('Could not post comment.');

        } finally {

            commentSendBtn.disabled = commentInput.value.trim().length === 0;

        }
    }


    commentInput.addEventListener('input', () => {

        commentSendBtn.disabled = commentInput.value.trim().length === 0;
        
    });

    
    commentSendBtn.addEventListener('click', postComment);

    commentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); postComment(); }
    });

    // live updates for anyone with the drawer open

    socket.on('new_comment', (comment) => {

        if (comment.room_id !== currentRoomId) return;

        addCommentToList(comment);
        updateCommentCount(commentList.querySelectorAll('.comment-item').length);


        showLiveCommentBubble(comment);



    });










</script>


</body>
</html>
