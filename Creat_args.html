<head>

    <link rel="stylesheet" href="/style.css">

     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

    <style>
        .minimal-title {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px ;
            color: #ffffff;
            margin-bottom: 2rem;
            text-align: center;
        }

        .premium-input-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            max-width: 500px;
        }

        .premium-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9ca3af;
            padding-left: 0.5rem;
        }

        .premium-input {
            width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 18px 24px;
            color: #ffffff;
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-input:focus {
            border-color: #3b82f6;
            background: #0b0f19;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), 0 10px 30px rgba(0, 0, 0, 0.4);
        }


        .radar-invite-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            max-width: 280px;
            margin: 1.5rem auto 1.25;

            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 14px;

            padding: 14px 28px;

            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;

            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

        }

        .radar-invite-btn:hover {
            border-color: #3b82f6;
            background: linear-gradient(135deg, #243049, #131722);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), 0 8px 24px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .radar-invite-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .radar-invite-btn .material-symbols-outlined {
            font-size: 1.1rem;
            color: #3b82f6;
        }

        .live-ticker{
            display:flex;
            align-items:center;
            gap:8px;
            background:#111827;
            border:1px solid #1f2937;
            border-radius:999px;
            padding:8px 18px;
            margin-bottom:1.5rem;
            font-size:.85rem;
            color:#9ca3af;
            font-weight:600;
        }

        .live-ticker .dot{
            width:8px; height:8px;
            border-radius:50%;
            background:#22c55e;
            box-shadow:0 0 8px #22c55e;
            animation:tickerPulse 1.5s infinite;
            flex-shrink:0;
        }

        @keyframes tickerPulse{
            0%,100%{ opacity:1; }
            50%{ opacity:.4; }
        }

        .radar-hint{
            transition:opacity .3s ease;
        }

        .radar-hint.fade{
            opacity:0;
        }

        /* ---- Invite nudge modal ---- */

        .invite-nudge-overlay{
            position:fixed; inset:0;
            background:rgba(10,12,20,.75);
            backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);
            display:flex; align-items:center; justify-content:center;
            z-index:3000;
            opacity:0;
            animation:nudgeFadeIn .25s ease-out forwards;
        }

        @keyframes nudgeFadeIn{ to{ opacity:1; } }

        .invite-nudge-box{
            background:#111827;
            border:1px solid rgba(59,130,246,.25);
            border-radius:20px;
            padding:32px 28px;
            max-width:380px;
            width:90%;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.55);
            transform:scale(.9) translateY(10px);
            animation:nudgePop .3s cubic-bezier(.34,1.56,.64,1) forwards;
        }

        @keyframes nudgePop{ to{ transform:scale(1) translateY(0); } }

        .invite-nudge-box .icon{
            font-size:2.2rem;
            margin-bottom:10px;
        }

        .invite-nudge-box h3{
            color:#fff;
            font-size:1.15rem;
            margin-bottom:8px;
        }

        .invite-nudge-box p{
            color:#9ca3af;
            font-size:.9rem;
            line-height:1.5;
            margin-bottom:22px;
        }

        .invite-nudge-actions{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .invite-nudge-primary{
            border:none;
            cursor:pointer;
            padding:14px 0;
            border-radius:12px;
            font-weight:700;
            font-size:.95rem;
            color:#fff;
            background:linear-gradient(135deg,#3b82f6,#2563eb);
            box-shadow:0 4px 16px rgba(59,130,246,.35);
            transition:transform .15s ease, filter .15s ease;
        }

        .invite-nudge-primary:hover{ transform:translateY(-1px); filter:brightness(1.1); }

        .invite-nudge-secondary{
            background:none;
            border:none;
            cursor:pointer;
            color:#6b7280;
            font-size:.85rem;
            padding:6px;
        }

        .invite-nudge-secondary:hover{ color:#9ca3af; }




    </style>
</head>

    <div class="app-body">

                <h1 class="minimal-title">⚔️ Start Duel ⚔️</h1>

                <div class="premium-input-container">
                    <label class="premium-label" for="argument-point">Topic</label>

                    <span class="material-symbols-outlined">ios_share</span>

    <script>
        const socket = io();

        const btnIgnite = document.getElementById('btn-ignite');
        const workspace = document.getElementById('creation-workspace');
        const matchmakingStatus = document.getElementById('matchmaking-status');
        const timerDisplay = document.getElementById('timer-display');
        const btnCancel = document.getElementById('btn-cancel-queue');
        const btnInviteMatch = document.getElementById('btn-invite-friend');
        const argumentInput = document.getElementById('argument-point');

        let countdownInterval;
        let myCurrentMatchId = null;

        function startTimer(durationInSeconds) {

            let timeRemaining = durationInSeconds;
            countdownInterval = setInterval(() => {

                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;
                
                minutes = minutes < 10 ? '0' + minutes : minutes;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                timerDisplay.textContent = `${minutes}:${seconds}`;
                if (--timeRemaining < 0) {
                    clearInterval(countdownInterval);
                    timerDisplay.textContent = "Expired";
                }
            }, 1000);

        }
 
        btnIgnite.addEventListener('click', async () => {

            const thesis = argumentInput.value.trim();

            if (!thesis) {
                alert('Please enter a topic before the battle ');
                return;
            }

            await window.authReady;

            workspace.style.display = 'none';
            matchmakingStatus.style.display = 'flex';

            startTimer(180);

            socket.emit('join_queue', {
                mode: '1v1',
                thesis: thesis
            });
        });

        socket.on('duel_created', (data) => {
            myCurrentMatchId = data.matchId;
        });

        btnInviteMatch.addEventListener('click', () => {
            if (!myCurrentMatchId) {
                alert('Still setting up your duel — try again in a second.');
                return;
            }

            const thesis = argumentInput.value.trim();
            const inviteLink = `${window.location.origin}/Create?matchId=${myCurrentMatchId}`;

            if (navigator.share) {
                navigator.share({
                    title: 'Want to challenge me ? ',
                    text: `Debate me on: "${thesis}"`,
                    url: inviteLink
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(inviteLink).then(() => {
                    alert('Invite link copied to clipboard!\n' + inviteLink);
                });
            }
        });

        btnCancel.addEventListener('click', () => {
            clearInterval(countdownInterval);

            if (myCurrentMatchId) {
                socket.emit('leave_queue', { matchId: myCurrentMatchId });
            }

            matchmakingStatus.style.display = 'none';
            workspace.style.display = 'flex';
            myCurrentMatchId = null;
        });

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const inviteMatchId = params.get('matchId');

            if (inviteMatchId) {
                workspace.style.display = 'none';
                matchmakingStatus.style.display = 'flex';
                timerDisplay.textContent = "Joining...";

                socket.emit('join_match', { matchId: inviteMatchId });
            }
        });

        socket.on('match_error', (data) => {
            alert(data.message);
            window.location.href = '/Create';
        });

        socket.on('match_found', (data) => {
            clearInterval(countdownInterval);
            window.location.href = `/live?match=${data.matchId}&role=${data.role}`;
        });


        /* ---- Live ticker: queue depth + live match count ---- */

    let currentQueueLen = 0;

    let currentLiveLen = 0;

    function updateTickerText(){

        const el = document.getElementById('liveTickerText');
        if (!el) return;

        if (currentLiveLen > 0){
            el.textContent = `${currentLiveLen} debate${currentLiveLen === 1 ? '' : 's'} live right now`;
        } else if (currentQueueLen > 0){
            el.textContent = `${currentQueueLen} other${currentQueueLen === 1 ? '' : 's'} waiting for a match`;
        } else {
            el.textContent = `You're first in the queue — invite someone for an instant match`;

        }
    }

    socket.on('update_duel_list', (queue) => {

        currentQueueLen = Math.max(0, (queue || []).length - 1); // exclude self

        updateTickerText();
    });

    socket.on('update_live_matches', (matches) => {

        currentLiveLen = (matches || []).length;
        updateTickerText();
        
    });


/* ---- Rotating hint text while waiting ---- */

    const HINT_MESSAGES = [
        'Your topic is locked. We are tracking an opponent...',
        'Scanning the arena for a worthy challenger...',
        'Still looking — this can take a minute during off-peak hours.',
        'Pro tip: inviting a friend gets you into a debate instantly.',
        'Hang tight, someone sharp is out there.'
    ];

    let hintIndex = 0;
    let hintInterval = null;

    function startHintRotation(){
        hintIndex = 0;
        clearInterval(hintInterval);
        hintInterval = setInterval(() => {
            const el = document.getElementById('radarHintText');
            if (!el) return;

            el.classList.add('fade');
            setTimeout(() => {
                hintIndex = (hintIndex + 1) % HINT_MESSAGES.length;
                el.textContent = HINT_MESSAGES[hintIndex];
                el.classList.remove('fade');
            }, 300);

        }, 4000);
    }

    function stopHintRotation(){
        clearInterval(hintInterval);
    }


    /* ---- Auto-prompt invite nudge after 20s of no match ---- */

    let nudgeTimeout = null;

    function scheduleInviteNudge(){
        clearTimeout(nudgeTimeout);
        nudgeTimeout = setTimeout(showInviteNudge, 20000);
    }

    function clearInviteNudge(){
        clearTimeout(nudgeTimeout);
        const existing = document.getElementById('inviteNudgeOverlay');
        if (existing) existing.remove();
    }

    function showInviteNudge(){
        if (document.getElementById('inviteNudgeOverlay')) return;

        const overlay = document.createElement('div');
        overlay.id = 'inviteNudgeOverlay';
        overlay.className = 'invite-nudge-overlay';

        overlay.innerHTML = `
            <div class="invite-nudge-box">
                <div class="icon">👀</div>
                <h3>No one's around right now</h3>
                <p>Want to challenge a specific friend instead of waiting on a stranger?</p>
                <div class="invite-nudge-actions">
                    <button class="invite-nudge-primary" id="nudgeInviteBtn">Invite a friend to debate</button>
                    <button class="invite-nudge-secondary" id="nudgeKeepWaitingBtn">Keep waiting</button>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        document.getElementById('nudgeInviteBtn').onclick = () => {
            overlay.remove();
            btnInviteMatch.click();
        };

        document.getElementById('nudgeKeepWaitingBtn').onclick = () => {
            overlay.remove();
        };
    }


    /* ---- Hook into existing start/cancel/match_found flow ---- */

    const _originalIgniteHandler = btnIgnite.onclick;

    btnIgnite.addEventListener('click', () => {
        startHintRotation();
        scheduleInviteNudge();
    });

    btnCancel.addEventListener('click', () => {
        stopHintRotation();
        clearInviteNudge();
    });

    socket.on('match_found', () => {
        stopHintRotation();
        clearInviteNudge();
    });


    </script>

</body>
